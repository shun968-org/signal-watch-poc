# actions/labeler の設定。PR にブランチ名と変更したファイルからラベルを付ける。
type:feature:
  - head-branch: ['^feature/']
type:fix:
  - head-branch: ['^fix/']
type:docs:
  - head-branch: ['^docs/']
type:chore:
  - head-branch: ['^chore/']
type:refactor:
  - head-branch: ['^refactor/']
type:test:
  - head-branch: ['^test/']

# 領域ごとの area:*。足すときは scripts/setup-github-repo.sh の LABELS にも足す
area:ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', 'scripts/**', '.devcontainer/**', 'lefthook.yml', 'commitlint.config.js']
area:watch:
  - changed-files:
      - any-glob-to-any-file: ['src/**', 'tests/**', 'pyproject.toml', 'uv.lock']
area:config:
  - changed-files:
      - any-glob-to-any-file: ['targets.yaml']
area:docs:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', '*.md']
