name: Watch

# 監視対象を巡回し、変更を snapshots ブランチに保存して Slack に通知する(基本設計 F-02・F-06・F-07)。
on:
  # JST 9・12・15・18 時台の1日4回。各対象は targets.yaml の interval_hours に達したときだけ取得する。
  # 毎時0分は GitHub Actions が混雑して遅れやすいのでずらす。schedule は遅延・スキップがありうる
  schedule:
    - cron: "17 0,3,6,9 * * *"
  workflow_dispatch:
    inputs:
      target_id:
        description: 取得する監視対象の id(空なら取得間隔に達した有効な全対象。指定時も最小間隔 1 時間は守る)
        required: false
        default: ""
      test_notification:
        description: Slack にテスト通知だけを送る(巡回はしない。SLACK_WEBHOOK_URL と AI 要約の確認用)
        type: boolean
        default: false

# 実行が重なって、対象サイトに同時にアクセスしたり snapshots への push が競合したりしないようにする
concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # snapshots ブランチへの push
    steps:
      # 外部の Action はコミット SHA で固定する(基本設計「非機能設計」)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # snapshots ブランチ(スナップショットと state.json)。push するので認証情報を残す
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: snapshots
          path: .snapshots

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"
          python-version: "3.13"
          # 定期実行がキャッシュを書き込まないようにする(依存は少なく、キャッシュの効果も小さい)
          enable-cache: false

      - run: uv sync --locked --no-dev

      # AI 要約に使う Claude Code(ADR-0004)。版を固定する
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false # Claude Code を入れるだけなので npm のキャッシュは使わない
      - run: npm install -g @anthropic-ai/claude-code@2.1.288

      # 通知のステップには Claude のサブスクリプションのトークンだけを渡す。
      # API キー(ANTHROPIC_API_KEY など)は Secret にもここにも置かない(従量課金になるため。ADR-0004)
      - name: テスト通知
        if: ${{ inputs.test_notification }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run --no-dev python -m signal_watch notify --test

      - name: コミットする人を設定
        if: ${{ !inputs.test_notification }}
        run: |
          git -C .snapshots config user.name "github-actions[bot]"
          git -C .snapshots config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 巡回
        if: ${{ !inputs.test_notification }}
        env:
          TARGET_ID: ${{ inputs.target_id }}
        run: |
          args=(--snapshots .snapshots --results "$RUNNER_TEMP/results.json")
          [ -z "$TARGET_ID" ] || args+=(--id "$TARGET_ID")
          uv run --no-dev python -m signal_watch run "${args[@]}"

      - name: snapshots ブランチに push
        if: ${{ !inputs.test_notification }}
        run: |
          # 競合したら1度だけ取り込み直して push する(concurrency で通常は起きない)
          git -C .snapshots push origin HEAD:snapshots \
            || { git -C .snapshots pull --rebase origin snapshots && git -C .snapshots push origin HEAD:snapshots; }

      # push の後に送る(通知の「差分を見る」のリンク先のコミットが GitHub に上がっているように)
      - name: Slack に通知
        if: ${{ !inputs.test_notification }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run --no-dev python -m signal_watch notify --results "$RUNNER_TEMP/results.json"
