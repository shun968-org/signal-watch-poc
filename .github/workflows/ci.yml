name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ルールセットの必須チェック。ジョブ名を変えるときは scripts/setup-github-repo.sh も直す
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # prepare(lefthook install)は CI では不要なので無効化する
      - run: npm ci --ignore-scripts

      # Python(ADR-0002, ADR-0003)。uv のバージョンは .devcontainer/Dockerfile と揃える
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --locked

      - name: lint
        run: uv run ruff check

      - name: 書式
        run: uv run ruff format --check

      - name: 型検査
        run: uv run mypy

      - name: テスト
        run: uv run pytest

      - name: ADR の書式
        run: |
          shopt -s nullglob
          files=(docs/adr/*.md)
          [ "${#files[@]}" -eq 0 ] || scripts/check-adr-format.sh "${files[@]}"

      # squash merge では PR タイトルがコミットメッセージになる
      - name: PR タイトルが Conventional Commits か
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx --no -- commitlint

      - name: ブランチ名
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(feature|fix|docs|chore|refactor|test)/[0-9]+-[a-z0-9-]+$'
          [[ "$BRANCH" =~ $pattern ]] || { echo "ブランチ名 '$BRANCH' が <type>/<issue番号>-<slug> に一致しない" >&2; exit 1; }
